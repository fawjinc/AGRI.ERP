name: Build APK
on:
  push:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Unzip project
        run: unzip -q agri-mobile.zip -d work
      - name: Build APK
        working-directory: work/agri-mobile
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: agri-erp-apk
          path: work/agri-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
