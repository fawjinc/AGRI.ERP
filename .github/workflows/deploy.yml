name: Build and deploy app
on:
  push:
    branches: [main]
    paths: ['agri-mobile.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: |
          unzip -q agri-mobile.zip -d build
          cd build/agri-mobile
          npm install --no-audit --no-fund
          npm run build
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/agri-mobile/dist
          publish_branch: gh-pages
          cname: erp.kayanagri.co
