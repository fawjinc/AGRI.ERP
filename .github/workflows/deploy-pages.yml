name: Deploy PWA (iPhone/web)
on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unzip project
        run: unzip -q agri-mobile.zip -d work

      - name: Install & build web app (PWA)
        working-directory: work/agri-mobile
        run: |
          npm install
          npm run build

      - name: Deploy dist/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: work/agri-mobile/dist
